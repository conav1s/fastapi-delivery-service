default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files

  - repo: local
    hooks:
      - id: lint-fix
        name: ruff lint fixing
        entry: uv run poe lint-fix
        language: system
        types: [python]
        pass_filenames: false

      - id: format
        name: ruff format fixing
        entry: uv run poe format-fix
        language: system
        types: [python]
        pass_filenames: false

      - id: typecheck
        name: mypy typechecking
        entry: uv run poe typecheck
        language: system
        types: [python]
        pass_filenames: false

      - id: test-unit
        name: unit-testing
        entry: uv run poe test-unit
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      # - id: test-api
      #   name: testing
      #   entry: uv run poe test-api
      #   language: system
      #   pass_filenames: false
      #   always_run: true
      #   stages: [pre-push]
