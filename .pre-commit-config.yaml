default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files

  - repo: local
    hooks:
      - id: lint-fix
        name: ruff check
        entry: uv run poe lint-fix
        language: system
        types: [python]
        pass_filenames: false

      - id: format
        name: ruff format
        entry: uv run poe format
        language: system
        types: [python]
        pass_filenames: false

      - id: typecheck
        name: mypy
        entry: uv run poe typecheck
        language: system
        types: [python]
        pass_filenames: false

      - id: test
        name: pytest
        entry: uv run poe test
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
