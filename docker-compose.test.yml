name: delivery-service-test

services:
  test-database:
    image: postgres:18.6-alpine3.23
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: delivery_test
    ports:
      - "55432:5432"
    tmpfs:
      - "/var/lib/postgresql"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d delivery_test"]
      interval: 2s
      retries: 10
