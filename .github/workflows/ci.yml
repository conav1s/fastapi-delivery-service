name: CI

on:
  push:
    branches: [ "dev" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint-and-test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18.6-alpine3.23
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: delivery_test
        ports:
          - 55432:5432
        options:
          --health-cmd "ph-isready -U test -d delivery_test"
          --health-interval 5s --health-timeout 5s --helath-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: "Install uv"
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.0"
          enable-cache: true

      - name: "Set up Python"
        run: uv python install

      - name: "Install the project"
        run: uv sync --locked

      - name: "Lint Checking"
        run: uv run poe lint-check

      - name: "Format Checking"
        run: uv run poe format-check

      - name: "Type Checking"
        run: uv run poe typecheck

      - name: "Run tests"
        run: uv run poe test-unit

  docker-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: "Build imgage"
        run: docker build --target prod .
